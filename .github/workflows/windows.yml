name: Windows build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: revora-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build and test desktop app
        shell: pwsh
        run: ./scripts/build.ps1 -Test
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            base-devel git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-autotools
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-curl-winssl
            mingw-w64-x86_64-libzip
            mingw-w64-x86_64-readline
      - name: Build pinned Apple device tools
        shell: msys2 {0}
        run: bash scripts/build-native.sh
      - name: Package executable and device tools
        shell: pwsh
        run: |
          ./scripts/build.ps1 -NativeTools dist/Revora/tools -Package
          Compress-Archive -Path dist/native-sources/* -DestinationPath dist/Revora-native-sources.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Revora-windows-x64
          path: |
            dist/Revora-windows-x64.zip
            dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Revora-native-sources
          path: dist/Revora-native-sources.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Revora-windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: Revora-native-sources
          path: release
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" release/* --prerelease --generate-notes --title "Revora $GITHUB_REF_NAME"
